# Builds the probe title inside the image published by the pokemmo-ps5-buildenv repository
# (same owner, see that repo's image workflow). The PokeMMO client is never downloaded here.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase; the owner name may not be (Shabbypenguin), and a job-level
      # `container:` image can't be lowercased, so the image is run explicitly.
      - name: Pull build environment image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/pokemmo-ps5-buildenv:latest"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$image"

      - name: Build probe title and release zip
        run: docker run --rm -v "$PWD:/work" -w /work "$IMAGE" make package-probe

      - name: Check title contents
        run: |
          set -euo pipefail
          title=build/titles/PPSA27165/dist/PPSA27165
          for file in eboot.bin sce_module/libc.prx sce_sys/param.json; do
            test -s "$title/$file"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pokemmo-prospero-probe
          path: dist/pokemmo-prospero-probe-installer.zip
          if-no-files-found: error

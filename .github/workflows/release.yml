# SPDX-License-Identifier: GPL-3.0-or-later
# Publishes a GitHub Release: builds the title in the pokemmo-ps5-buildenv image and attaches the .ffpfsc image, .zip, and .pkg.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0-beta"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::version must look like v1.2.3 or v1.2.3-beta"; exit 1; }
            if git rev-parse -q --verify "refs/tags/$version" >/dev/null || gh release view "$version" >/dev/null 2>&1; then
              echo "::error::$version already exists"; exit 1
            fi
            [[ "$version" == "v$(tr -d ' \r\n' < VERSION)" ]] || { echo "::error::VERSION says $(cat VERSION): give v$(tr -d ' \r\n' < VERSION), or change VERSION first"; exit 1; }
            git tag "$version"
          else
            version="$GITHUB_REF_NAME"
            [[ "$version" == "v$(tr -d ' \r\n' < VERSION)" ]] || { echo "::error::tag $version but VERSION says $(cat VERSION)"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Pull build environment image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/pokemmo-ps5-buildenv:latest"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$image"

      - name: Build the title and its image
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" bash -c "make loader && make image-loader"
          mkdir -p /tmp/fpkg-builder /tmp/fpkg-out
          curl -fsSL https://github.com/thanhsondev/PSVIETHOA-FPKG-Builder/releases/download/v3.2.0/PSVIETHOA-FPKG-Builder-3.2.0-linux-x64.tar.gz | tar -xz -C /tmp/fpkg-builder --strip-components=1
          chmod +x /tmp/fpkg-builder/fpkg-cli
          /tmp/fpkg-builder/fpkg-cli build --source build/titles/PPSA98001/dist/PPSA98001 --output /tmp/fpkg-out --overwrite
          mv /tmp/fpkg-out/*.pkg PPSA98001.pkg

      - name: Check the outputs
        run: |
          set -euo pipefail
          test -s build/titles/PPSA98001/dist/PPSA98001/eboot.bin
          test -s build/titles/PPSA98001/dist/PPSA98001/sce_module/libc.prx
          test -s build/titles/PPSA98001/dist/PPSA98001/sce_sys/param.json
          test -s dist/PPSA98001.ffpfsc
          test -s PPSA98001.pkg
          grep -q "\"$VERSION\"" build/titles/PPSA98001/src/prospero_version.h || { echo "::error::the build does not carry $VERSION"; exit 1; }
          ( cd build/titles/PPSA98001/dist && zip -r -q "$GITHUB_WORKSPACE/PPSA98001.zip" PPSA98001 )
          ( cd dist && sha256sum PPSA98001.ffpfsc ) > SHA256SUMS.txt
          sha256sum PPSA98001.zip PPSA98001.pkg >> SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "PokeMMO-Prospero $VERSION" --generate-notes --target "$GITHUB_SHA")
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$VERSION" "${flags[@]}" \
            dist/PPSA98001.ffpfsc PPSA98001.zip PPSA98001.pkg SHA256SUMS.txt

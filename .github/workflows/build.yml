# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the title (folder zip, installer zip and .ffpfsc image) inside the image published by the pokemmo-ps5-buildenv repository
# (same owner, see that repo's image workflow). The PokeMMO client is never downloaded here.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  title:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase; the owner name may not be (Shabbypenguin), and a job-level
      # `container:` image can't be lowercased, so the image is run explicitly.
      - name: Pull build environment image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/pokemmo-ps5-buildenv:latest"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$image"

      - name: Build the title, its installer zip and its image
        run: docker run --rm -v "$PWD:/work" -w /work "$IMAGE" bash -c "make package-loader && make image-loader"

      - name: Check title contents
        run: |
          set -euo pipefail
          for file in eboot.bin sce_module/libc.prx sce_sys/param.json; do
            test -s "build/titles/PPSA98001/dist/PPSA98001/$file"
          done
          test -s dist/PPSA98001.ffpfsc

      - uses: actions/upload-artifact@v4
        with:
          name: pokemmo-prospero-loader
          path: dist/pokemmo-prospero-loader-installer.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PPSA98001-ffpfsc
          path: dist/PPSA98001.ffpfsc
          if-no-files-found: error

  # The same loader on Linux, run against nothing but itself: catches build breaks of the shared adapters (the client is never
  # downloaded in CI, so the run itself happens on a developer's PC with `make host-run`).
  host-loader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the host loader
        run: sudo apt-get install -y --no-install-recommends clang zlib1g-dev && make host-loader

# PokeMMO-Prospero: the settings a PS5 player starts with. Lines in PokeMMO's own config/main.properties format.
# Applied by the loader before the game starts: in full on a new install, and once per DEFAULTS_VERSION on an existing one
# (the player's own changes afterwards stay). Values taken from a console set up by hand (loader-11).
DEFAULTS_VERSION=1
# Fullscreen at the console's 1920x1080 (the client's own default is a 1024x768 window).
client.graphics.display_mode=1
client.graphics.width=1920
client.graphics.height=1080
# Frame rate cap matching the TV.
client.graphics.max_fps=60
# Interface scale for a TV at couch distance.
client.gui.scale.ui_zoom2=1.25

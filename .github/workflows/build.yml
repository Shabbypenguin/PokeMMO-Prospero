# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the title (folder zip for developers, .ffpfsc image, and .pkg FPKG) inside the image published by the pokemmo-ps5-buildenv repository
# (same owner, see that repo's image workflow). The PokeMMO client is never downloaded here.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  title:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pull build environment image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/pokemmo-ps5-buildenv:latest"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$image"

      - name: Build the title and its image
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" bash -c "make loader && make image-loader"
          mkdir -p /tmp/fpkg-builder /tmp/fpkg-out
          curl -fsSL https://github.com/thanhsondev/PSVIETHOA-FPKG-Builder/releases/download/v3.2.0/PSVIETHOA-FPKG-Builder-3.2.0-linux-x64.tar.gz | tar -xz -C /tmp/fpkg-builder --strip-components=1
          chmod +x /tmp/fpkg-builder/fpkg-cli
          /tmp/fpkg-builder/fpkg-cli build --source build/titles/PPSA98001/dist/PPSA98001 --output /tmp/fpkg-out --overwrite
          mv /tmp/fpkg-out/*.pkg PPSA98001.pkg

      - name: Check title contents
        run: |
          set -euo pipefail
          test -s build/titles/PPSA98001/dist/PPSA98001/eboot.bin
          test -s build/titles/PPSA98001/dist/PPSA98001/sce_module/libc.prx
          test -s build/titles/PPSA98001/dist/PPSA98001/sce_sys/param.json
          test -s dist/PPSA98001.ffpfsc
          test -s PPSA98001.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: pokemmo-prospero-loader
          path: dist/pokemmo-prospero-loader-PPSA98001.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PPSA98001-ffpfsc
          path: dist/PPSA98001.ffpfsc
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PPSA98001-fpkg
          path: PPSA98001.pkg
          if-no-files-found: error

  host-loader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the host loader
        run: sudo apt-get install -y --no-install-recommends clang zlib1g-dev && make host-loader
